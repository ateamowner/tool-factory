name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ateamkit.com

      - name: Verify Pages root files
        run: |
          test -f out/index.html && test -f out/.nojekyll
          test -f out/78d30441c01d40bff5f9c5bd2ec23255.txt
          test "$(tr -d '[:space:]' < out/78d30441c01d40bff5f9c5bd2ec23255.txt)" = "78d30441c01d40bff5f9c5bd2ec23255"
          grep -F 'rel="canonical" href="https://ateamkit.com/"' out/index.html
          grep -F '<loc>https://ateamkit.com/</loc>' out/sitemap.xml
          grep -F 'Sitemap: https://ateamkit.com/sitemap.xml' out/robots.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Ping Bing IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Type stripping (`--experimental-strip-types`) needs Node 22+.
          node-version: 22

      - name: Submit sitemap URLs to Bing IndexNow
        run: node --experimental-strip-types scripts/ping-indexnow.ts
